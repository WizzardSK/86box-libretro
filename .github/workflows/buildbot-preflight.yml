# What the buildbot's Linux jobs (.gitlab-ci.yml) do, in containers with the
# images' base and packages, as their registry cannot be reached from here:
# the same CMake commands as the linux-cmake template.
name: buildbot preflight

on:
  workflow_dispatch:

jobs:
  linux:
    name: ${{ matrix.job }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - job: libretro-build-linux-x64
            runner: ubuntu-24.04
            image: ubuntu:bionic
          - job: libretro-build-linux-aarch64
            runner: ubuntu-24.04-arm
            image: ubuntu:jammy
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Build in ${{ matrix.image }}
        run: |
          docker run --rm -v "$PWD":/src -w /src ${{ matrix.image }} bash -ec '
            export DEBIAN_FRONTEND=noninteractive
            apt-get update
            apt-get install -y software-properties-common gpg wget build-essential git
            # The images: gcc-12 from the toolchain PPAs, newer CMake (savoury1 on
            # Bionic, Kitware on Jammy), and the packages that bring the libraries
            if grep -q bionic /etc/os-release; then
              add-apt-repository -y ppa:savoury1/build-tools
              add-apt-repository -y ppa:savoury1/gcc-defaults-12
              add-apt-repository -y ppa:ubuntu-toolchain-r/test
            else
              add-apt-repository -y ppa:ubuntu-toolchain-r/test
              wget -qO - https://apt.kitware.com/keys/kitware-archive-latest.asc | gpg --dearmor -o /usr/share/keyrings/kitware-archive-keyring.gpg
              echo "deb [signed-by=/usr/share/keyrings/kitware-archive-keyring.gpg] https://apt.kitware.com/ubuntu/ jammy main" > /etc/apt/sources.list.d/kitware.list
            fi
            apt-get update
            apt-get install -y cmake gcc-12 g++-12 ninja-build libglib2.0-dev libass-dev libgtk-3-dev libsndfile1-dev
            export CC=gcc-12 CXX=g++-12 CORENAME=86box BUILD_DIR=build/linux-$(uname -m) EXTRA_PATH=src
            cmake --version | head -1
            cmake -DCMAKE_BUILD_TYPE=Release -DLIBRETRO=ON -DRELEASE=ON -DDYNAREC=ON . -B$BUILD_DIR
            cmake --build $BUILD_DIR --target ${CORENAME}_libretro --config Release -- -j $(nproc)
            mv $BUILD_DIR/$EXTRA_PATH/${CORENAME}_libretro.so .
            strip --strip-unneeded ${CORENAME}_libretro.so
            readelf -d ${CORENAME}_libretro.so | grep NEEDED
          '
