name: libretro core

on:
  push:
    branches: [libretro]
  pull_request:
    branches: [libretro]
  workflow_dispatch:

jobs:
  linux:
    name: libretro core (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: linux-x86_64
            runner: ubuntu-24.04
          - arch: linux-aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          cmake ninja-build pkg-config
          libfreetype-dev libpng-dev libsndfile1-dev libglib2.0-dev zlib1g-dev

      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja
          -D CMAKE_BUILD_TYPE=Release
          -D LIBRETRO=ON
          -D RELEASE=ON
          -D DYNAREC=ON

      - name: Build
        run: cmake --build build --target 86Box

      - name: Collect
        run: |
          mkdir -p out
          cp "$(find build -name '86box_libretro.so' | head -1)" out/
          cp src/libretro/86box_libretro.info out/ 2>/dev/null || true
          file out/86box_libretro.so
          nm -D --defined-only out/86box_libretro.so | grep -c ' T retro_' || true
          readelf -d out/86box_libretro.so | grep NEEDED
          if readelf -d out/86box_libretro.so | grep -q 'NEEDED.*libslirp'; then echo 'libslirp must be linked statically'; exit 1; fi

      - uses: actions/upload-artifact@v4
        with:
          name: 86box_libretro-${{ matrix.arch }}
          path: out/

  windows:
    name: libretro core (windows-x86_64)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake mingw-w64-x86_64-ninja mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-freetype mingw-w64-x86_64-libpng mingw-w64-x86_64-libsndfile
            mingw-w64-x86_64-glib2 mingw-w64-x86_64-zlib

      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja
          -D CMAKE_BUILD_TYPE=Release
          -D LIBRETRO=ON
          -D RELEASE=ON
          -D DYNAREC=ON
          -D STATIC_BUILD=ON

      - name: Build
        run: cmake --build build --target 86Box

      - name: Collect
        run: |
          mkdir -p out
          cp "$(find build -name '86box_libretro.dll' | head -1)" out/
          cp src/libretro/86box_libretro.info out/ 2>/dev/null || true
          objdump -p out/86box_libretro.dll | grep -E 'DLL Name|retro_run'

      - uses: actions/upload-artifact@v4
        with:
          name: 86box_libretro-windows-x86_64
          path: out/

  macos:
    name: libretro core (macos-arm64)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # The libraries as static archives from vcpkg (classic mode, outside the
      # repository's Qt manifest), so the core needs nothing from Homebrew
      - name: Dependencies
        run: |
          brew install ninja pkg-config
          cd "$RUNNER_TEMP"
          "$VCPKG_INSTALLATION_ROOT/vcpkg" install --triplet arm64-osx \
            "freetype[core,zlib,png]" libpng "libsndfile[core]" glib zlib
          echo "DEPS=$VCPKG_INSTALLATION_ROOT/installed/arm64-osx" >> "$GITHUB_ENV"

      - name: Configure
        run: |
          export PKG_CONFIG_PATH="$DEPS/lib/pkgconfig"
          # vcpkg's freetype and libpng targets link ZLIB::ZLIB, which no
          # find_package here makes: it is defined right after project()
          cat > "$RUNNER_TEMP/deps.cmake" <<EOF
          if(NOT TARGET ZLIB::ZLIB)
            add_library(ZLIB::ZLIB STATIC IMPORTED GLOBAL)
            set_target_properties(ZLIB::ZLIB PROPERTIES
              IMPORTED_LOCATION "$DEPS/lib/libz.a"
              INTERFACE_INCLUDE_DIRECTORIES "$DEPS/include")
            set(ZLIB_FOUND TRUE)
            set(ZLIB_LIBRARY "$DEPS/lib/libz.a")
            set(ZLIB_INCLUDE_DIR "$DEPS/include")
          endif()
          EOF
          cmake -S . -B build -G Ninja \
            -D CMAKE_BUILD_TYPE=Release \
            -D LIBRETRO=ON \
            -D RELEASE=ON \
            -D DYNAREC=ON \
            -D CMAKE_MACOSX_BUNDLE=OFF \
            -D CMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -D VCPKG_MANIFEST_MODE=OFF \
            -D CMAKE_PROJECT_INCLUDE="$RUNNER_TEMP/deps.cmake" \
            -D CMAKE_FIND_PACKAGE_TARGETS_GLOBAL=ON \
            -D VCPKG_TARGET_TRIPLET=arm64-osx \
            -D CMAKE_IGNORE_PREFIX_PATH=/opt/homebrew \
            -D CMAKE_SHARED_LINKER_FLAGS="$(pkg-config --static --libs glib-2.0 sndfile freetype2 libpng zlib) -framework CoreFoundation -framework Foundation -framework AppKit"

      - name: Build
        run: cmake --build build --target 86Box

      - name: Collect
        run: |
          mkdir -p out
          cp "$(find build -name '86box_libretro.dylib' -o -name '86box_libretro.so' | head -1)" out/
          cp src/libretro/86box_libretro.info out/ 2>/dev/null || true
          otool -L out/*.dylib
          if otool -L out/*.dylib | grep -q /opt/homebrew; then echo 'linked against Homebrew'; exit 1; fi

      - uses: actions/upload-artifact@v4
        with:
          name: 86box_libretro-macos-arm64
          path: out/
